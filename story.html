<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Long Way Round · Deogracious Kiprop</title>
  <meta name="description" content="A first-person journey through the worlds Deogracious Kiprop builds in: a misty forest, a heartbeat, farmland, a gold vault, a launch pad, a server room, a battle royale drop and the deep end.">
  <meta name="theme-color" content="#0b0f0d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23161616'/><path d='M8 36h12l5-14 7 26 6-18 4 6h14' fill='none' stroke='%23ff6b55' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="story/story.css">
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>

  <!-- Cinematic letterbox bars -->
  <div class="bar top" aria-hidden="true"></div>
  <div class="bar bottom" aria-hidden="true"></div>

  <!-- Always available: leave, and music -->
  <a class="corner skip" href="index.html">Skip to the portfolio →</a>
  <button class="corner music" type="button" aria-pressed="false">♪ Sound: off</button>

  <!-- Title screen -->
  <section class="start" id="start">
    <p class="kicker">A story in eight worlds</p>
    <h1>The Long Way Round</h1>
    <p class="sub">First person. About five minutes. Headphones help.</p>
    <div class="choices">
      <button type="button" class="go" data-music="on">Begin, with sound</button>
      <button type="button" class="go quiet" data-music="off">Begin quietly</button>
    </div>
    <p class="resume" hidden><button type="button" class="link" id="restart">Start over</button></p>
    <p class="loading" id="loading">Loading the world…</p>
  </section>

  <!-- In-story HUD -->
  <div class="hud" id="hud" hidden>
    <p class="chapter" id="chapter"></p>
    <ol class="fragments" id="fragments" aria-label="Fragments collected"></ol>
  </div>
  <div class="title-card" id="card" aria-live="polite"></div>
  <div class="narration" id="narration" aria-live="polite" hidden>
    <p id="line"></p>
    <span class="hint" id="hint">tap or press space</span>
  </div>
  <div class="prompt" id="prompt" aria-live="polite" hidden></div>

  <!-- End of what's built so far -->
  <section class="end" id="end" hidden>
    <p class="kicker" id="end-kicker"></p>
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <div class="choices">
      <a class="go" href="index.html">Enter the portfolio</a>
      <button type="button" class="go quiet" id="again">Walk it again</button>
    </div>
  </section>

  <!-- Fallback for devices without 3D: the original intro -->
  <section class="classic" id="classic" hidden>
    <h1>A Journey Beyond the Familiar</h1>
    <p class="quote" id="quote"></p>
    <a class="go" href="index.html">Enter</a>
  </section>

  <script type="module" src="story/main.js"></script>
</body>
</html>
